<!doctype html><meta charset="utf-8"><title>render</title>
<script type="module">
import { createSpace } from '/site/space-audio.js';
window.render = async (secs = 22) => {
  const sr = 44100, ctx = new OfflineAudioContext(2, sr * secs, sr);
  const sp = createSpace(ctx, { seed: 11 });
  sp.output.connect(ctx.destination);
  sp.start(0); sp.fadeTo(1, 3, 0, 0);
  sp.bell(3.2, 1174.66, 0.05, -0.4); sp.bell(4.1, 1567.98, 0.03, 0.5);
  [6.0, 6.35, 6.8, 7.4].forEach(t => sp.hover(t));
  sp.select(9.0);
  sp.nova(13.0);
  sp.bell(15.5, 932.33, 0.045, 0.3);
  [17.0, 17.5].forEach(t => sp.hover(t));
  sp.tick(0, secs);
  sp.fadeTo(0, 2.5, secs - 2.6, 1);
  const buf = await ctx.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  let peak = 0; for (let i = 0; i < L.length; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
  const out = new Int16Array(L.length * 2);
  for (let i = 0; i < L.length; i++) { out[2*i] = Math.max(-1, Math.min(1, L[i])) * 32767; out[2*i+1] = Math.max(-1, Math.min(1, R[i])) * 32767; }
  const bytes = new Uint8Array(out.buffer); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return { peak, sr, b64: btoa(bin) };
};
window.ready = true;
</script>
